<h2>All Doctors</h2>

<div *ngIf="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<ul *ngIf="!loading && !error">
  <li *ngFor="let doctor of doctors">
    Name: <strong> {{ doctor.name }} </strong><br>
    Lastname: <strong> {{ doctor.lastname }}</strong><br> 
    Experience: {{ doctor.experience }} Years<br><br>
  </li>
</ul>
